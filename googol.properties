# Configuração do Googol (alterar sem recompilar)

# IP e porto do RMI registry da fila de URLs (máquina #1 na defesa)
rmi.host=localhost
rmi.port=1099

# IP desta máquina, usado pelo RMI para os callbacks (java.rmi.server.hostname)
rmi.hostname.local=localhost

# Nome da fila de URLs no registry
queue.name=URLQueue

# URLs iniciais da fila (separados por vírgula)
queue.seeds=https://www.uc.pt

# Número de novas tentativas para um URL cujo download falhou
queue.max.retries=2

# IP e porto do RMI registry da Gateway (a Gateway cria o seu próprio registry) e nome no registry
gateway.host=localhost
gateway.port=1100
gateway.name=Gateway

# Tempo sem heartbeat de um Barrel até a Gateway o considerar avariado e o retirar da lista (milissegundos)
gateway.barrel.timeout.ms=10000

# Intervalo entre tentativas de reenviar à fila os URLs pedidos enquanto ela estava em baixo (milissegundos)
gateway.queue.retry.ms=3000

# Ficheiro onde a Gateway guarda os URLs pendentes e as contagens de pesquisas (recuperação de avarias)
gateway.data.file=data/gateway.ser

# Intervalo entre gravações periódicas das contagens de pesquisas da Gateway (milissegundos)
gateway.save.interval.ms=5000

# Pausa entre pedidos do downloader (milissegundos)
downloader.delay.ms=1000

# Intervalo entre verificações da fila e da lista de Barrels, e entre tentativas de nova ligação (milissegundos)
downloader.reconnect.ms=3000

# Intervalo entre retransmissões de uma mensagem a um Barrel que não respondeu (milissegundos)
multicast.retry.ms=2000

# Pasta onde os Barrels guardam o índice (apagar esta pasta limpa os dados de teste)
barrel.data.dir=data

# Intervalo entre gravações do índice em ficheiro (milissegundos)
barrel.save.interval.ms=5000

# Intervalo entre heartbeats (registos) de cada Barrel na Gateway (milissegundos)
barrel.heartbeat.ms=3000

# Cliente: intervalo entre tentativas quando a Gateway não responde, e entre verificações da
# Gateway no ecrã de estatísticas (milissegundos)
client.retry.ms=3000

# Cliente: número de tentativas de um pedido antes de desistir e voltar ao menu
client.retry.attempts=10
